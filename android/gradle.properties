# PDF Fit Gradle settings.
#
# The heap is deliberately moderate so the project also builds on 8 GB developer
# laptops and low-memory CI runners. Raise -Xmx if you have plenty of RAM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Keep R8's memory use predictable for release builds.
android.r8.maxMemory=1536m
